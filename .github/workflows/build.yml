
name: Build Flarial V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Project Files
        run: |
          test -f settings.gradle || {
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          }

          test -f build.gradle || {
            echo "ERROR: build.gradle tidak ditemukan"
            exit 1
          }

          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle tidak ditemukan"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml tidak ditemukan"
            exit 1
          }

      - name: Validate Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("AndroidManifest.xml valid!")
          except ET.ParseError as error:
              print(f"Manifest XML error: {error}")
              raise SystemExit(1)
          PY

      - name: Build Flarial V2
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Flarial-V2.apk

      - name: Upload Flarial V2
        uses: actions/upload-artifact@v4
        with:
          name: Flarial-V2
          path: output/Flarial-V2.apk
          if-no-files-found: error
