
name: Build FLARIAL V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project Files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/flarial/v2/MainActivity.kt
          test -f app/src/main/java/com/flarial/v2/FloatingService.kt

      - name: Validate Manifest
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml')"

      - name: Build FLARIAL V2
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Flarial-V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLARIAL-V2-APK
          path: output/Flarial-V2.apk
          if-no-files-found: error
