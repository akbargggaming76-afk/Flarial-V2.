
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flarial.v2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flarial.v2'
        minSdk 23
        targetSdk 28

        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
